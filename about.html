const HTML_LANG = { en: 'en', zh: 'zh-CN', es: 'es', fr: 'fr', ko: 'ko', hi: 'hi' };
function applyLang(code) {
  const t = L[code] || L.en;
  document.documentElement.lang = HTML_LANG[code] || 'en';
  document.getElementById('t-h1').textContent = t.h1;
  document.getElementById('t-back').textContent = t.back;
  document.getElementById('body').innerHTML = t.s.map(([h, b]) => `<section><h2>${h}</h2>${b}</section>`).join('') + `<p class="note">${t.updated}</p>`;
  document.getElementById('lang-select').value = code;
}
let start = 'en';
try {
  const q = new URLSearchParams(location.search).get('lang');
  const s = q || localStorage.getItem('gis-lang');
  if (s && L[s]) start = s;
} catch (e) {}
applyLang(start);
document.getElementById('lang-select').addEventListener('change', e => {
  applyLang(e.target.value);
  try { localStorage.setItem('gis-lang', e.target.value); } catch (err) {}
});
</script>
